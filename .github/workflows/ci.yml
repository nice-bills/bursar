name: CI

# Only the checks that need no secrets. Everything that moves value —
# demo, chaos, agent — needs a KeeperHub key and a funded wallet, so it stays
# a deliberate local step rather than something a fork can trigger.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs a token. Saying so explicitly means a compromised
# dependency in the build cannot use one either.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.6 is the floor `engines` advertises — `node --test --import`
        # landed there, so the declared minimum has to be exercised, not
        # assumed.
        node: ["20.6", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck (src, scripts and tests)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Relative imports carry their extension
        # moduleResolution "Bundler" accepts an extensionless specifier that
        # then fails at runtime in the published raw-ESM package.
        run: npm run check:imports

      - name: Test
        run: npm test

      - name: Build the publishable package
        run: npm run build

      - name: Verify the built entry point loads
        run: node --input-type=module -e "import('./dist/index.js').then(m => { if (!m.bursarPlugin) { throw new Error('bursarPlugin missing from build'); } })"

      - name: Verify the example config actually loads
        # The README tells a new user to copy this file. It shipping invalid
        # once was enough.
        run: |
          node --input-type=module -e "
            import('./dist/config.js').then(m => m.loadConfig('bursar.config.example.json'))
              .then(() => console.log('bursar.config.example.json loads'))
          "

      - name: Verify the package contents
        run: npm pack --dry-run

      - name: Typecheck the example counterparty agent
        working-directory: examples/lucid-agent
        run: npm install --no-audit --no-fund && npm run typecheck
